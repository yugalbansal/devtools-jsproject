<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hash Generator - DevTools</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/hash.css">
</head>
<body>
    <header>
        <h1>DevTools</h1>
    </header>

    <main>
        <a href="index.html" class="nav-link">Back to Home</a>
        <h2>Hash Generator</h2>

        <div class="container">
            <label for="hashInput">Enter Text</label>
            <textarea id="hashInput" rows="6" placeholder="Type or paste text here..."></textarea>
            <button id="generateBtn">Generate SHA-256</button>
        </div>

        <div class="container">
            <h3>Result</h3>
            <div id="hashOutput" class="hash-output"></div>
        </div>
    </main>

    <footer>
        <p>DevTools - A Beginner College Project</p>
    </footer>

    <script src="js/hash.js"></script>
</body>
</html>
