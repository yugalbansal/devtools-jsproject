<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hash Generator - DevTools</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/hash.css">
    <script>
    (function () {
        var t = localStorage.getItem('devtools-theme');
        if (t !== 'dark' && t !== 'light') {
            t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = t;
    })();
    </script>
</head>
<body>
    <nav class="site-nav">
        <div class="nav-inner">
            <a class="brand" href="index.html"><span class="brand-logo"></span>DevTools</a>
            <div class="nav-links">
                <a class="nav-link" href="diff.html">Diff</a>
                <a class="nav-link active" aria-current="page" href="hash.html">Hash</a>
                <a class="nav-link" href="jwt.html">JWT</a>
                <a class="nav-link" href="storage.html">Storage</a>
            </div>
            <button class="theme-toggle" type="button" aria-label="Toggle dark mode" title="Toggle dark mode" aria-pressed="false">
                <span class="icon-moon">☾</span>
                <span class="icon-sun">☀</span>
            </button>
        </div>
    </nav>

    <main>
        <h2>Hash Generator</h2>

        <div class="container">
            <label for="hashInput">Enter Text</label>
            <textarea id="hashInput" rows="6" placeholder="Type or paste text here..."></textarea>
            <button id="generateBtn">Generate SHA-256</button>
        </div>

        <div class="container">
            <h3>Result</h3>
            <div id="hashOutput" class="hash-output"></div>
            <button id="copyBtn">Copy</button>
        </div>
    </main>

    <script src="js/theme.js"></script>
    <script src="js/hash.js"></script>
</body>
</html>
