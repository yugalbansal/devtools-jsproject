<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diff Checker - DevTools</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/diff.css">
    <script>
    (function () {
        var t = localStorage.getItem('devtools-theme');
        if (t !== 'dark' && t !== 'light') {
            t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = t;
    })();
    </script>
</head>
<body>
    <nav class="site-nav">
        <div class="nav-inner">
            <a class="brand" href="index.html"><span class="brand-logo"></span>DevTools</a>
            <div class="nav-links">
                <a class="nav-link active" aria-current="page" href="diff.html">Diff</a>
                <a class="nav-link" href="hash.html">Hash</a>
                <a class="nav-link" href="jwt.html">JWT</a>
                <a class="nav-link" href="storage.html">Storage</a>
            </div>
            <button class="theme-toggle" type="button" aria-label="Toggle dark mode" title="Toggle dark mode" aria-pressed="false">
                <span class="icon-moon">☾</span>
                <span class="icon-sun">☀</span>
            </button>
        </div>
    </nav>

    <main>
        <h2>Diff Checker</h2>

        <div class="container">
            <div class="diff-inputs">
                <div>
                    <label for="originalText">Original Text</label>
                    <textarea id="originalText" rows="10" placeholder="Enter original text here..."></textarea>
                </div>
                <div>
                    <label for="newText">New Text</label>
                    <textarea id="newText" rows="10" placeholder="Enter new text here..."></textarea>
                </div>
            </div>
            <button id="compareBtn">Compare</button>
        </div>

        <div class="container">
            <h3>Result</h3>
            <div id="diffResult" class="diff-result"></div>
        </div>
    </main>

    <script src="js/theme.js"></script>
    <script src="js/diff.js"></script>
</body>
</html>
