<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Storage Manager - DevTools</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/storage.css">
    <script>
    (function () {
        var t = localStorage.getItem('devtools-theme');
        if (t !== 'dark' && t !== 'light') {
            t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = t;
    })();
    </script>
</head>
<body>
    <nav class="site-nav">
        <div class="nav-inner">
            <a class="brand" href="index.html"><span class="brand-logo"></span>DevTools</a>
            <div class="nav-links">
                <a class="nav-link" href="diff.html">Diff</a>
                <a class="nav-link" href="hash.html">Hash</a>
                <a class="nav-link" href="jwt.html">JWT</a>
                <a class="nav-link active" aria-current="page" href="storage.html">Storage</a>
            </div>
            <button class="theme-toggle" type="button" aria-label="Toggle dark mode" title="Toggle dark mode" aria-pressed="false">
                <span class="icon-moon">☾</span>
                <span class="icon-sun">☀</span>
            </button>
        </div>
    </nav>

    <main>
        <h2>Storage Manager</h2>

        <div class="container">
            <label for="storageKey">Key</label>
            <input type="text" id="storageKey" placeholder="e.g. username">

            <label for="storageValue">Value</label>
            <input type="text" id="storageValue" placeholder="e.g. john123">

            <label for="storageType">Storage Type</label>
            <select id="storageType">
                <option value="local">localStorage</option>
                <option value="session">sessionStorage</option>
            </select>

            <button id="addBtn">Add / Update</button>
            <button id="deleteBtn" class="btn-danger">Delete Key</button>
            <button id="clearBtn" class="btn-danger">Clear All</button>
        </div>

        <div class="container">
            <h3>Stored Data</h3>
            <div id="storageDisplay"></div>
        </div>
    </main>

    <script src="js/theme.js"></script>
    <script src="js/storage.js"></script>
</body>
</html>
