<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JWT Decoder - DevTools</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/jwt.css">
    <script>
    (function () {
        var t = localStorage.getItem('devtools-theme');
        if (t !== 'dark' && t !== 'light') {
            t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = t;
    })();
    </script>
</head>
<body>
    <nav class="site-nav">
        <div class="nav-inner">
            <a class="brand" href="index.html"><span class="brand-logo"></span>DevTools</a>
            <div class="nav-links">
                <a class="nav-link" href="diff.html">Diff</a>
                <a class="nav-link" href="hash.html">Hash</a>
                <a class="nav-link active" aria-current="page" href="jwt.html">JWT</a>
                <a class="nav-link" href="storage.html">Storage</a>
            </div>
            <button class="theme-toggle" type="button" aria-label="Toggle dark mode" title="Toggle dark mode" aria-pressed="false">
                <span class="icon-moon">☾</span>
                <span class="icon-sun">☀</span>
            </button>
        </div>
    </nav>

    <main>
        <div class="page-head">
            <div class="tool-icon tint-green">✦</div>
            <div>
                <h1 class="page-title">JWT Decoder</h1>
                <p class="page-desc">Decode and inspect JSON Web Tokens</p>
            </div>
        </div>

        <div class="container">
            <label for="jwtInput">Paste JWT Token</label>
            <textarea id="jwtInput" class="mono" rows="5" placeholder="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."></textarea>
            <button id="decodeBtn">Decode JWT</button>
            <button id="copyBtn" class="btn-secondary copy-btn">Copy Payload</button>
        </div>

        <div class="container">
            <div class="jwt-section">
                <h3>Header</h3>
                <div id="jwtHeader" class="jwt-output"></div>
            </div>

            <div class="jwt-section">
                <h3>Payload</h3>
                <div id="jwtPayload" class="jwt-output"></div>
            </div>
        </div>
    </main>

    <script src="js/theme.js"></script>
    <script src="js/jwt.js"></script>
</body>
</html>
